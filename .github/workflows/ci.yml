name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deno:
    name: Deno CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
          cache: true

      - name: Install Deno dependencies
        run: deno install --frozen

      - name: Check formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint --rules-exclude=no-slow-types

      - name: Build
        run: deno task build

      - name: Run tests
        run: deno task test
