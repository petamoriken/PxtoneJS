name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 4.1.4)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: "https://registry.npmjs.org"

      - name: Install Deno dependencies
        run: deno install --frozen

      - name: Bump version
        run: deno run --allow-read --allow-write tools/bump_version.ts "${{ inputs.version }}"

      - name: Build
        run: deno task build && deno task build:npm

      - name: Publish to JSR
        run: deno publish --allow-dirty

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: ./npm

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: bundle/*
