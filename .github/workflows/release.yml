name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 4.1.4)
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: "https://registry.npmjs.org"

      - name: Install Deno dependencies
        run: deno install --frozen

      - name: Bump version
        run: deno run --allow-read --allow-write tools/bump_version.ts "${{ inputs.version }}"

      - name: Build
        run: deno task build && deno task build:npm

      - name: Publish to JSR
        run: deno publish --allow-dirty

      - name: Publish to npm
        run: |
          if npm view "pxtone@${{ inputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ inputs.version }} is already published to npm, skipping"
          else
            npm publish --provenance --access public
          fi
        working-directory: ./npm

      - name: Commit version bump
        id: bump_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${{ inputs.version }}"
          git commit -am "chore: bump version to v${{ inputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin "release/v${{ inputs.version }}"

      - name: Open version bump PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${{ inputs.version }}" \
            --title "chore: bump version to v${{ inputs.version }}" \
            --body "Automated version bump for release v${{ inputs.version }}."

      - name: Wait for checks to be registered
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          for i in {1..30}; do
            count=$(gh pr checks "release/v${{ inputs.version }}" \
              --required --json name --jq 'length' 2>/dev/null || true)

            if [ "$count" -gt 0 ]; then
              exit 0
            fi

            echo "Checks are not registered yet ($i/30)"
            sleep 10
          done

          echo "Timed out waiting for checks to be registered"
          exit 1

      - name: Wait for required checks
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh pr checks "release/v${{ inputs.version }}" --watch --required

      - name: Merge version bump PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh pr merge "release/v${{ inputs.version }}" --merge --delete-branch

      - name: Tag version bump
        run: |
          git tag "v${{ inputs.version }}" "${{ steps.bump_commit.outputs.sha }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: bundle/*
